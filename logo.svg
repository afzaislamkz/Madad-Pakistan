<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" class="w-full h-auto max-w-md mx-auto">
  <defs>
    <!-- Background Circle Gradient -->
    <radialGradient id="golBg" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#0F2942" />
      <stop offset="70%" stop-color="#081626" />
      <stop offset="100%" stop-color="#040D18" />
    </radialGradient>

    <!-- Emergency Red Gradient -->
    <linearGradient id="emergencyRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D4D" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>

    <!-- Caring Female Figure Cyan Gradient -->
    <linearGradient id="careCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Gold Accent Gradient for Trust -->
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- MAIN OUTER GOL CIRCLE -->
  <circle cx="250" cy="250" r="240" fill="url(#golBg)" stroke="#1E293B" stroke-width="4" />

  <!-- Outer Emergency Ring / Border Accent -->
  <circle cx="250" cy="250" r="225" fill="none" stroke="url(#emergencyRed)" stroke-width="6" stroke-dasharray="16 10" opacity="0.8" />
  <circle cx="250" cy="250" r="212" fill="none" stroke="url(#careCyan)" stroke-width="2" opacity="0.5" />

  <!-- BACKGROUND EMERGENCY CROSS (SOFT GLOW) -->
  <g opacity="0.15" filter="url(#glowEffect)">
    <path d="M225 100 H275 V225 H400 V275 H275 V400 H225 V275 H100 V225 H225 Z" fill="url(#emergencyRed)" />
  </g>

  <!-- HEARTBEAT / ECG LINE IN BACKGROUND -->
  <path d="M60 250 H160 L175 210 L195 285 L215 220 L230 260 L245 250 H440" 
        fill="none" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.35" />

  <!-- CENTRAL EMOTIONAL SYMBOL: GIRL / FEMALE PROTECTING LIFE -->
  <g transform="translate(150, 95)">
    <!-- Girl / Woman Head with Hair Flow Silhouette -->
    <path d="M100 25 C86 25 75 36 75 50 C75 60 80 68 88 72 C72 90 60 115 60 140 C75 130 95 125 100 125 C105 125 125 130 140 140 C140 115 128 90 112 72 C120 68 125 60 125 50 C125 36 114 25 100 25 Z" 
          fill="url(#careCyan)" />
    
    <!-- Protective Embracing Arms Silhouette -->
    <path d="M50 115 C35 135 40 165 65 180 C80 190 120 190 135 180 C160 165 165 135 150 115 C135 140 120 150 100 150 C80 150 65 140 50 115 Z" 
          fill="url(#careCyan)" opacity="0.9" />

    <!-- Protected Glowing Heart in Center -->
    <path d="M100 145 C100 145 70 122 70 105 C70 96 77 89 86 89 C92 89 97 92 100 96 C103 92 108 89 114 89 C123 89 130 96 130 105 C130 122 100 145 100 145 Z" 
          fill="url(#emergencyRed)" filter="url(#glowEffect)" />
          
    <!-- Small Hope Star -->
    <polygon points="100,72 103,79 110,80 105,85 106,92 100,88 94,92 95,85 90,80 97,79" fill="url(#goldAccent)" />
  </g>

  <!-- CIRCULAR CURVED TEXT (TOP & BOTTOM) -->
  <path id="textArcTop" d="M 80,250 A 170,170 0 1,1 420,250" fill="none" />
  <path id="textArcBottom" d="M 420,250 A 170,170 0 0,1 80,250" fill="none" />

  <!-- TOP TEXT: BRAND NAME -->
  <text font-family="'Inter', 'Arial Black', sans-serif" font-weight="900" font-size="38" fill="#FFFFFF" letter-spacing="8">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      MADAD
    </textPath>
  </text>

  <!-- BOTTOM TEXT: MOTIVE / SLOGAN -->
  <text font-family="'Inter', sans-serif" font-weight="700" font-size="16" fill="#38BDF8" letter-spacing="4">
    <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">
      • SAVING LIVES PAKISTAN •
    </textPath>
  </text>

  <!-- DECORATIVE SIDE STARS -->
  <circle cx="82" cy="250" r="5" fill="url(#emergencyRed)" />
  <circle cx="418" cy="250" r="5" fill="url(#emergencyRed)" />
</svg>
